<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#0f172a">
  <meta name="application-name" content="Shopping List">
  <meta name="apple-mobile-web-app-title" content="Shopping List">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <title>Shopping List 1.0.0</title>
  <style>
    :root{--bg:#f5f5f4;--card:#fff;--soft:#f8fafc;--text:#1e293b;--muted:#94a3b8;--line:#e2e8f0;--head:#0f172a;--green:#10b981;--input:#fff}
    body.dark{--bg:#020617;--card:#0f172a;--soft:#1e293b;--text:#f1f5f9;--muted:#64748b;--line:#1e293b;--head:#0f172a;--input:#1e293b}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.25s}
    button,input{font:inherit} button{cursor:pointer}.wrap{max-width:760px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}.hero{background:var(--head);color:#fff;border-radius:28px;padding:26px;box-shadow:0 18px 45px #0002}.heroTop{display:flex;justify-content:space-between;gap:16px}.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#6ee7b7;font-size:14px;font-weight:700}.versionBadge{display:inline-flex;padding:3px 8px;border-radius:999px;background:#ffffff1f;color:#fff;font-size:11px;line-height:1.2}.hero h1{font-size:38px;margin:8px 0}.hero p{color:#cbd5e1;margin:0}.tools{display:flex;gap:8px;align-items:flex-start}.iconBtn,.theme{border:0;border-radius:16px;background:#ffffff18;color:white;height:48px;padding:0 14px;font-weight:700}.cart{background:#34d399;color:#0f172a;font-size:24px;width:48px;padding:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:24px}.stat{background:#ffffff14;border-radius:16px;padding:12px}.stat b{display:block;font-size:24px}.stat small{color:#cbd5e1}.amber{color:#fcd34d}.green{color:#6ee7b7}
    .row{display:flex;gap:10px;margin-top:14px}.searchRow{display:grid;grid-template-columns:1fr auto}.box{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 2px 8px #0000000d}.field{width:100%;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:12px;padding:12px 14px;outline:none}.field:focus{border-color:var(--green);box-shadow:0 0 0 3px #10b98122}.primary,.secondary{border:0;border-radius:12px;padding:12px 16px;font-weight:800}.primary{background:var(--green);color:#fff}.secondary{background:var(--card);color:var(--text);box-shadow:0 2px 8px #0000000d}.secondary:disabled{opacity:.4}
    .categories{display:grid;gap:12px;margin-top:18px}.category{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 2px 8px #0000000d;border:1px solid transparent}body.dark .category,body.dark .box{border-color:#1e293b}.catHead{display:flex;align-items:center;gap:12px;padding:15px}.catIcon{width:48px;height:48px;border:0;border-radius:16px;font-size:24px}.catTitle{flex:1;min-width:0;border:0;background:none;color:var(--text);text-align:left}.catTitle b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.catTitle small{color:var(--muted)}.mini{background:none;border:0;color:var(--muted);padding:8px;font-size:18px}.danger:hover{color:#e11d48}.items{border-top:1px solid var(--line);padding:12px}.item{display:flex;align-items:center;gap:9px;background:var(--soft);border-radius:16px;padding:10px;margin-bottom:8px}.item.bought{background:#10b98116}.check{width:28px;height:28px;border-radius:50%;border:2px solid #94a3b8;background:transparent;color:transparent;font-weight:bold}.bought .check{background:var(--green);border-color:var(--green);color:#fff}.name{flex:1;min-width:0;border:0;background:none;color:var(--text);text-align:left;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bought .name{text-decoration:line-through;color:var(--muted)}.qty{display:flex;background:var(--card);border-radius:12px;overflow:hidden}.qty button{width:32px;height:32px;border:0;background:none;color:var(--text)}.qty span{width:28px;text-align:center;line-height:32px;font-weight:800}.addItem{display:flex;gap:8px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:32px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}

    .updateNotice{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:13px 14px;border-radius:16px;background:linear-gradient(135deg,#047857,#0f766e);color:#fff;box-shadow:0 8px 24px #0003}.updateNotice[hidden]{display:none}.updateNotice strong,.updateNotice span{display:block}.updateNotice span{margin-top:3px;color:#d1fae5;font-size:12px}.updateNotice button{flex:0 0 auto;border:0;border-radius:11px;padding:10px 12px;background:#fff;color:#065f46;font-weight:800}
    .modalBackdrop{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:#020617b8}.modalBackdrop[hidden]{display:none}.modalCard{width:min(100%,520px);max-height:88vh;overflow:auto;border-radius:24px;padding:20px;background:var(--card);color:var(--text);box-shadow:0 24px 70px #0008}.modalHead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.modalHead h2{margin:0;font-size:22px}.modalClose{border:0;border-radius:50%;width:38px;height:38px;background:var(--soft);color:var(--text);font-size:21px}.updateMeta{margin:6px 0 0;color:var(--muted);font-size:12px}.updateChanges{margin:18px 0;padding-left:22px;line-height:1.55}.modalActions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:18px}.updateError{margin-top:12px;padding:10px 12px;border-radius:11px;background:#fff1f2;color:#be123c;font-size:12px}.updateError[hidden]{display:none}.releaseList{display:grid;gap:10px;margin-top:16px}.releaseCard{padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--soft)}.releaseCard h3{margin:0 0 4px}.releaseCard small{color:var(--muted)}.releaseCard ul{margin:9px 0 0;padding-left:20px}.currentBadge{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:999px;background:#d1fae5;color:#065f46;font-size:10px}.footer button{margin-top:8px;border:0;background:transparent;color:var(--green);font-weight:800;text-decoration:underline}
    @media(max-width:580px){.wrap{padding:calc(14px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)).hero{padding:20px}.hero h1{font-size:30px}.theme span:last-child{display:none}.searchRow{grid-template-columns:1fr}.catHead{gap:7px;padding:12px}.catTitle b{font-size:18px}.mini{padding:6px}.item{gap:6px}.qty button{width:29px}.cart{display:none}.heroTop{gap:10px}.hero{border-radius:24px}.updateNotice{align-items:stretch;flex-direction:column}.updateNotice button{width:100%}.modalActions{flex-direction:column-reverse}.modalActions button{width:100%}}
  </style>
</head>
<body>
<div id="app"></div>

<div class="modalBackdrop" id="updateModal" hidden role="presentation">
 <section class="modalCard" role="dialog" aria-modal="true" aria-labelledby="updateTitle">
  <div class="modalHead"><div><h2 id="updateTitle">Nová verze aplikace</h2><p class="updateMeta" id="updateMeta"></p></div><button class="modalClose" id="closeUpdate" type="button" aria-label="Zavřít">×</button></div>
  <ul class="updateChanges" id="updateChanges"></ul><div class="updateError" id="updateError" hidden role="alert"></div>
  <div class="modalActions"><button class="secondary" id="updateLater" type="button">Připomenout později</button><button class="primary" id="installUpdate" type="button">Aktualizovat nyní</button></div>
 </section>
</div>
<div class="modalBackdrop" id="historyModal" hidden role="presentation">
 <section class="modalCard" role="dialog" aria-modal="true" aria-labelledby="historyTitle"><div class="modalHead"><div><h2 id="historyTitle">Co je nového</h2><p class="updateMeta">Nainstalovaná verze 1.0.0</p></div><button class="modalClose" id="closeHistory" type="button" aria-label="Zavřít">×</button></div><div class="releaseList" id="releaseList"></div></section>
</div>
<script>
const DATA_KEY='shopping-list-cz-static-v1', THEME_KEY='shopping-list-theme';
const APP_VERSION='1.0.0', UPDATE_SEEN_KEY='shopping-list-update-seen';
let remoteRelease=null, swRegistration=null;
const $=id=>document.getElementById(id);
function compareVersions(a,b){const aa=String(a||'0').split(/[.-]/).map(Number),bb=String(b||'0').split(/[.-]/).map(Number);for(let i=0;i<Math.max(aa.length,bb.length);i++){const d=(aa[i]||0)-(bb[i]||0);if(d)return d>0?1:-1}return 0}
function formatReleaseDate(value){if(!value)return '';const d=new Date(value+'T12:00:00');return Number.isNaN(d.getTime())?value:d.toLocaleDateString('cs-CZ')}
function releaseChanges(r){return Array.isArray(r?.changes)?r.changes.filter(Boolean):[]}
function openUpdateDialog(info,available){remoteRelease=info;$('updateTitle').textContent=available?`Nová verze ${info.version}`:`Co je nového ve verzi ${info.version}`;$('updateMeta').textContent=[info.date?`Vydáno ${formatReleaseDate(info.date)}`:'',available?`Nainstalována verze ${APP_VERSION}`:''].filter(Boolean).join(' · ');$('updateChanges').innerHTML=releaseChanges(info).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Drobné opravy a vylepšení.</li>';$('installUpdate').textContent=available?'Aktualizovat nyní':'Rozumím';$('installUpdate').dataset.mode=available?'install':'close';$('updateLater').hidden=!available;$('updateError').hidden=true;$('updateModal').hidden=false}
function closeUpdateDialog(markSeen=false){$('updateModal').hidden=true;if(markSeen&&remoteRelease?.version)localStorage.setItem(UPDATE_SEEN_KEY,remoteRelease.version)}
function showUpdateNotice(info){$('updateNotice').hidden=false;$('updateNoticeTitle').textContent=`Je dostupná verze ${info.version}`;$('updateNoticeText').textContent=releaseChanges(info)[0]||'Novinky a opravy jsou připravené k instalaci.'}
async function checkForUpdates(){try{const response=await fetch(`./version.json?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status}`);const info=await response.json();if(!info?.version)throw Error('Chybí číslo verze.');remoteRelease=info;const available=compareVersions(info.version,APP_VERSION)>0;if(available){showUpdateNotice(info);openUpdateDialog(info,true)}else if(info.version===APP_VERSION&&localStorage.getItem(UPDATE_SEEN_KEY)!==APP_VERSION)openUpdateDialog(info,false)}catch(error){console.info('Kontrola aktualizace není dostupná:',error.message)}}
async function installAvailableUpdate(){if($('installUpdate').dataset.mode==='close'){closeUpdateDialog(true);return}const button=$('installUpdate');button.disabled=true;button.textContent='Aktualizuji…';try{if(swRegistration){await swRegistration.update();if(swRegistration.waiting){swRegistration.waiting.postMessage({type:'SKIP_WAITING'});return}}const url=new URL(location.href);url.searchParams.set('updated',Date.now());location.replace(url.toString())}catch(error){$('updateError').textContent='Aktualizaci se nepodařilo dokončit. Zkontrolujte připojení a zkuste to znovu.';$('updateError').hidden=false;button.disabled=false;button.textContent='Zkusit znovu'}}
function openHistory(){const releases=Array.isArray(remoteRelease?.history)&&remoteRelease.history.length?remoteRelease.history:[remoteRelease||{version:APP_VERSION,date:'2026-11-06',changes:['První oficiální verze aplikace.']}];$('releaseList').innerHTML=releases.map(r=>`<article class="releaseCard"><h3>Verze ${esc(r.version)}${r.version===APP_VERSION?'<span class="currentBadge">Nainstalováno</span>':''}</h3><small>${formatReleaseDate(r.date)}</small><ul>${releaseChanges(r).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>`).join('');$('historyModal').hidden=false}

const defs=[
['fruit','Ovoce a zelenina','🍎','#dcfce7','#15803d',['Jablka','Banány','Pomeranče','Citrony','Hroznové víno','Rajčata','Okurky','Papriky','Mrkev','Brambory','Cibule','Česnek','Salát','Avokádo']],
['bakery','Pečivo','🥖','#fef3c7','#b45309',['Chléb','Rohlíky','Housky','Bageta','Toastový chléb','Celozrnné pečivo','Tortilly','Sladké pečivo']],
['dairy','Mléčné výrobky a vejce','🥛','#e0f2fe','#0369a1',['Mléko','Máslo','Jogurt','Sýr','Tvaroh','Smetana','Vejce','Pomazánkové máslo','Rostlinné mléko']],
['meat','Maso a uzeniny','🥩','#ffe4e6','#be123c',['Kuřecí prsa','Kuřecí stehna','Krůtí maso','Vepřové maso','Hovězí maso','Mleté maso','Šunka','Salám','Párky','Slanina']],
['fish','Ryby a mořské plody','🐟','#cffafe','#0e7490',['Losos','Treska','Tuňák','Sardinky','Krevety','Rybí filé','Uzená makrela']],
['pantry','Trvanlivé potraviny','🥫','#ffedd5','#c2410c',['Rýže','Těstoviny','Mouka','Cukr','Sůl','Olej','Ocet','Luštěniny','Konzervovaná rajčata','Kečup','Hořčice','Majonéza','Koření','Ovesné vločky','Káva','Čaj']],
['frozen','Mražené potraviny','❄️','#dbeafe','#1d4ed8',['Mražená zelenina','Mražené ovoce','Hranolky','Pizza','Rybí prsty','Zmrzlina','Led']],
['snacks','Sladkosti a pochutiny','🍫','#fce7f3','#be185d',['Čokoláda','Sušenky','Oplatky','Bonbony','Oříšky','Chipsy','Krekry','Popcorn','Müsli tyčinky']],
['drinks','Nápoje','🥤','#e0e7ff','#4338ca',['Minerální voda','Džus','Limonáda','Tonic','Sirup','Pivo','Víno','Káva','Čaj']],
['drugstore','Drogerie a hygiena','🧴','#ede9fe','#6d28d9',['Toaletní papír','Papírové kapesníky','Mýdlo','Sprchový gel','Šampon','Kondicionér','Zubní pasta','Zubní kartáček','Deodorant','Vatové tampony','Holicí potřeby']],
['household','Domácnost a úklid','🧽','#f1f5f9','#475569',['Prostředek na nádobí','Tablety do myčky','Prací gel','Aviváž','Čisticí prostředek','Houbičky','Hadříky','Pytle na odpadky','Papírové utěrky','Alobal','Pečicí papír','Potravinová fólie']],
['pets','Pro zvířata','🐾','#fef9c3','#a16207',['Granule','Konzervy','Pamlsky','Stelivo','Sáčky na exkrementy','Hračka','Šampon pro zvířata']],
['pharmacy','Lékárna','💊','#fce7f3','#be185d',['Valetol','Dulcolax','Pangrol','Vaxol','Normison','B-Komplex','Chrom','Diosmin','Biosil','Vitamín C','Multivitamíny','Paracetamol','Ibuprofen','Antihistaminikum','Pastilky na bolest v krku','Nosní sprej','Přípravek proti kašli','Rehydratační roztok','Aktivní uhlí','Dezinfekce','Náplasti','Obvaz','Teploměr']],
['other','Ostatní','🛍️','#f3f4f6','#4b5563',['Baterie','Žárovky','Svíčky','Zápalky','Lepicí páska','Přání nebo dárek','Květiny']]
];
const fresh=()=>defs.map(([id,name,icon,color,accent,names])=>({id,name,icon,color,accent,items:names.map((name,i)=>({id:id+'-'+i,name,quantity:1,bought:false,needed:false}))}));
const migrateCategories=(stored)=>{
 const pharmacyDefault=fresh().find(c=>c.id==='pharmacy');
 if(!Array.isArray(stored))return fresh();
 const pharmacyIndex=stored.findIndex(c=>c.id==='pharmacy');
 if(pharmacyIndex<0){const otherIndex=stored.findIndex(c=>c.id==='other');const next=[...stored];next.splice(otherIndex<0?next.length:otherIndex,0,pharmacyDefault);return next}
 const existing=stored[pharmacyIndex],names=new Set(existing.items.map(i=>i.name));
 const next=[...stored];next[pharmacyIndex]={...existing,icon:'💊',color:'#fce7f3',accent:'#be185d',items:[...existing.items,...pharmacyDefault.items.filter(i=>!names.has(i.name))]};return next
};
let categories;try{categories=migrateCategories(JSON.parse(localStorage.getItem(DATA_KEY)))}catch{categories=fresh()}
let open=new Set(), search='', showNeededOnly=false;
if(localStorage.getItem(THEME_KEY)==='dark')document.body.classList.add('dark');
const save=()=>localStorage.setItem(DATA_KEY,JSON.stringify(categories));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 const all=categories.flatMap(c=>c.items), bought=all.filter(i=>i.bought).length, needed=all.filter(i=>i.needed).length, q=search.trim().toLowerCase();
 const shown=categories.map(c=>({...c,shown:c.items.filter(i=>(!q||i.name.toLowerCase().includes(q))&&(!showNeededOnly||i.needed))})).filter(c=>showNeededOnly?c.shown.length:(!q||c.name.toLowerCase().includes(q)||c.shown.length));
 document.getElementById('app').innerHTML=`<div class="wrap"><header class="hero"><div class="heroTop"><div><div class="eyebrow">Můj nákupní seznam <span class="versionBadge">v${APP_VERSION}</span></div><h1>Shopping List</h1><p>Přehledně podle kategorií a vždy po ruce.</p></div><div class="tools"><button class="theme" onclick="toggleTheme()"><span>${document.body.classList.contains('dark')?'☀️':'🌙'}</span> <span>${document.body.classList.contains('dark')?'Světlý':'Tmavý'}</span></button><button class="iconBtn cart">🛒</button></div></div><div class="stats"><div class="stat"><b>${all.length}</b><small>Celkem</small></div><div class="stat"><b class="amber">${needed}</b><small>K nákupu</small></div><div class="stat"><b class="green">${bought}</b><small>Koupeno</small></div></div></header><section class="updateNotice" id="updateNotice" hidden><div><strong id="updateNoticeTitle">Je dostupná nová verze</strong><span id="updateNoticeText"></span></div><button id="openUpdateInfo" type="button">Zobrazit změny</button></section>
 <div class="row searchRow"><input class="field" value="${esc(search)}" oninput="setSearch(this.value)" placeholder="Hledat položku nebo kategorii…"><button class="secondary" ${needed?'':'disabled'} onclick="emptyCart()">Vyprázdni košík</button><button class="${showNeededOnly?'primary':'secondary'}" onclick="toggleNeededOnly()">🛒 ${showNeededOnly?'Zobrazit vše':'Jen k nákupu'}</button></div>
 <div class="row box"><input id="newCat" class="field" placeholder="Název nové kategorie…" onkeydown="if(event.key==='Enter')addCategory()"><button class="primary" onclick="addCategory()">+ Přidat</button></div>
 <div class="categories">${shown.map(catHTML).join('')}</div>${shown.length?'':'<div class="empty">Nic odpovídajícího nebylo nalezeno.</div>'}<div class="footer">Změny a zvolený vzhled se automaticky ukládají v tomto zařízení.<br><button type="button" onclick="openHistory()">Co je nového · verze ${APP_VERSION}</button></div></div>`;
}
function catHTML(c){const isOpen=open.has(c.id)||search.trim()||showNeededOnly;return `<section class="category"><div class="catHead"><button class="catIcon" style="background:${c.color};color:${c.accent}" onclick="toggle('${c.id}')">${c.icon||'🛍️'}</button><button class="catTitle" onclick="toggle('${c.id}')"><b>${esc(c.name)}</b><small>${c.items.length} položek · ${c.items.filter(i=>i.bought).length} koupeno</small></button><button class="mini" onclick="renameCategory('${c.id}')">✎</button><button class="mini danger" onclick="deleteCategory('${c.id}')">×</button><button class="mini" onclick="toggle('${c.id}')">${isOpen?'▲':'▼'}</button></div>${isOpen?`<div class="items">${c.shown.map(i=>itemHTML(c,i)).join('')}${c.shown.length?'':'<div class="empty">V této kategorii zatím nic není.</div>'}<div class="addItem"><input id="add-${c.id}" class="field" placeholder="Přidat položku…" onkeydown="if(event.key==='Enter')addItem('${c.id}')"><button class="primary" onclick="addItem('${c.id}')">+</button></div></div>`:''}</section>`}
function itemHTML(c,i){return `<div class="item ${i.bought?'bought':''}"><button class="check" onclick="toggleBought('${c.id}','${i.id}')">✓</button><button class="name" onclick="renameItem('${c.id}','${i.id}')">${esc(i.name)}</button><button class="mini" style="background:${i.needed?'#fbbf24':'transparent'};border-radius:10px" onclick="toggleNeeded('${c.id}','${i.id}')">🛒</button><div class="qty"><button onclick="qty('${c.id}','${i.id}',-1)">−</button><span>${i.quantity}</span><button onclick="qty('${c.id}','${i.id}',1)">+</button></div><button class="mini danger" onclick="deleteItem('${c.id}','${i.id}')">×</button></div>`}
function toggleNeededOnly(){showNeededOnly=!showNeededOnly;render()}
function toggleNeeded(cid,iid){const i=categories.find(c=>c.id===cid).items.find(i=>i.id===iid);i.needed=!i.needed;save();render()}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem(THEME_KEY,document.body.classList.contains('dark')?'dark':'light');render()}
function setSearch(v){search=v;render()} function toggle(id){open.has(id)?open.delete(id):open.add(id);render()}
function addCategory(){const e=document.getElementById('newCat'),name=e.value.trim();if(!name)return;categories.push({id:'c'+Date.now(),name,icon:'🛍️',color:'#e0e7ff',accent:'#4338ca',items:[]});save();render()}
function renameCategory(id){const c=categories.find(x=>x.id===id),n=prompt('Nový název kategorie:',c.name);if(n&&n.trim()){c.name=n.trim();save();render()}}
function deleteCategory(id){if(confirm('Opravdu smazat celou kategorii?')){categories=categories.filter(c=>c.id!==id);save();render()}}
function addItem(cid){const e=document.getElementById('add-'+cid),name=e.value.trim();if(!name)return;categories.find(c=>c.id===cid).items.push({id:'i'+Date.now(),name,quantity:1,bought:false,needed:true});save();render()}
function renameItem(cid,iid){const i=categories.find(c=>c.id===cid).items.find(i=>i.id===iid),n=prompt('Nový název položky:',i.name);if(n&&n.trim()){i.name=n.trim();save();render()}}
function deleteItem(cid,iid){const c=categories.find(c=>c.id===cid);c.items=c.items.filter(i=>i.id!==iid);save();render()}
function toggleBought(cid,iid){const i=categories.find(c=>c.id===cid).items.find(i=>i.id===iid);i.bought=!i.bought;save();render()}
function qty(cid,iid,d){const i=categories.find(c=>c.id===cid).items.find(i=>i.id===iid);i.quantity=Math.max(1,i.quantity+d);save();render()}
function emptyCart(){if(confirm('Vyprázdnit košík? Položky zůstanou uložené v seznamu.')){categories.forEach(c=>c.items.forEach(i=>{if(i.needed){i.needed=false;i.bought=false}}));save();render()}}
render();
$('closeUpdate').onclick=()=>closeUpdateDialog(false);
$('updateLater').onclick=()=>closeUpdateDialog(false);
$('installUpdate').onclick=installAvailableUpdate;
$('updateModal').onclick=event=>{if(event.target===$('updateModal'))closeUpdateDialog(false)};
$('closeHistory').onclick=()=>$('historyModal').hidden=true;
$('historyModal').onclick=event=>{if(event.target===$('historyModal'))$('historyModal').hidden=true};
document.addEventListener('click',event=>{if(event.target?.id==='openUpdateInfo'&&remoteRelease)openUpdateDialog(remoteRelease,compareVersions(remoteRelease.version,APP_VERSION)>0)});
if('serviceWorker' in navigator){let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;localStorage.setItem(UPDATE_SEEN_KEY,remoteRelease?.version||APP_VERSION);location.reload()});addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=1.0.0',{updateViaCache:'none'}).then(reg=>{swRegistration=reg;reg.update()}).catch(error=>console.info('Service worker se nepodařilo zaregistrovat:',error.message)))}
checkForUpdates();
</script>
