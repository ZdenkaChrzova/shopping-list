<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Shopping List</title>
  <style>
    :root{--bg:#f5f5f4;--card:#fff;--soft:#f8fafc;--text:#1e293b;--muted:#94a3b8;--line:#e2e8f0;--head:#0f172a;--green:#10b981;--input:#fff}
    body.dark{--bg:#020617;--card:#0f172a;--soft:#1e293b;--text:#f1f5f9;--muted:#64748b;--line:#1e293b;--head:#0f172a;--input:#1e293b}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.25s}
    button,input{font:inherit} button{cursor:pointer}.wrap{max-width:760px;margin:auto;padding:24px 16px 40px}.hero{background:var(--head);color:#fff;border-radius:28px;padding:26px;box-shadow:0 18px 45px #0002}.heroTop{display:flex;justify-content:space-between;gap:16px}.eyebrow{color:#6ee7b7;font-size:14px;font-weight:700}.hero h1{font-size:38px;margin:8px 0}.hero p{color:#cbd5e1;margin:0}.tools{display:flex;gap:8px;align-items:flex-start}.iconBtn,.theme{border:0;border-radius:16px;background:#ffffff18;color:white;height:48px;padding:0 14px;font-weight:700}.cart{background:#34d399;color:#0f172a;font-size:24px;width:48px;padding:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:24px}.stat{background:#ffffff14;border-radius:16px;padding:12px}.stat b{display:block;font-size:24px}.stat small{color:#cbd5e1}.amber{color:#fcd34d}.green{color:#6ee7b7}
    .row{display:flex;gap:10px;margin-top:14px}.searchRow{display:grid;grid-template-columns:1fr auto}.box{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 2px 8px #0000000d}.field{width:100%;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:12px;padding:12px 14px;outline:none}.field:focus{border-color:var(--green);box-shadow:0 0 0 3px #10b98122}.primary,.secondary{border:0;border-radius:12px;padding:12px 16px;font-weight:800}.primary{background:var(--green);color:#fff}.secondary{background:var(--card);color:var(--text);box-shadow:0 2px 8px #0000000d}.secondary:disabled{opacity:.4}
    .categories{display:grid;gap:12px;margin-top:18px}.category{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 2px 8px #0000000d;border:1px solid transparent}body.dark .category,body.dark .box{border-color:#1e293b}.catHead{display:flex;align-items:center;gap:12px;padding:15px}.catIcon{width:48px;height:48px;border:0;border-radius:16px;font-size:24px}.catTitle{flex:1;min-width:0;border:0;background:none;color:var(--text);text-align:left}.catTitle b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.catTitle small{color:var(--muted)}.mini{background:none;border:0;color:var(--muted);padding:8px;font-size:18px}.danger:hover{color:#e11d48}.items{border-top:1px solid var(--line);padding:12px}.item{display:flex;align-items:center;gap:9px;background:var(--soft);border-radius:16px;padding:10px;margin-bottom:8px}.item.bought{background:#10b98116}.check{width:28px;height:28px;border-radius:50%;border:2px solid #94a3b8;background:transparent;color:transparent;font-weight:bold}.bought .check{background:var(--green);border-color:var(--green);color:#fff}.name{flex:1;min-width:0;border:0;background:none;color:var(--text);text-align:left;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bought .name{text-decoration:line-through;color:var(--muted)}.qty{display:flex;background:var(--card);border-radius:12px;overflow:hidden}.qty button{width:32px;height:32px;border:0;background:none;color:var(--text)}.qty span{width:28px;text-align:center;line-height:32px;font-weight:800}.addItem{display:flex;gap:8px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:32px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
    @media(max-width:580px){.wrap{padding:12px 10px 30px}.hero{padding:20px}.hero h1{font-size:30px}.theme span:last-child{display:none}.searchRow{grid-template-columns:1fr}.catHead{gap:7px;padding:12px}.catTitle b{font-size:18px}.mini{padding:6px}.item{gap:6px}.qty button{width:29px}.cart{display:none}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const DATA_KEY='shopping-list-cz-static-v1', THEME_KEY='shopping-list-theme';
const defs=[
['fruit','Ovoce a zelenina','🍎','#dcfce7','#15803d',['Jablka','Banány','Pomeranče','Citrony','Hroznové víno','Rajčata','Okurky','Papriky','Mrkev','Brambory','Cibule','Česnek','Salát','Avokádo']],
['bakery','Pečivo','🥖','#fef3c7','#b45309',['Chléb','Rohlíky','Housky','Bageta','Toastový chléb','Celozrnné pečivo','Tortilly','Sladké pečivo']],
['dairy','Mléčné výrobky a vejce','🥛','#e0f2fe','#0369a1',['Mléko','Máslo','Jogurt','Sýr','Tvaroh','Smetana','Vejce','Pomazánkové máslo','Rostlinné mléko']],
['meat','Maso a uzeniny','🥩','#ffe4e6','#be123c',['Kuřecí prsa','Kuřecí stehna','Krůtí maso','Vepřové maso','Hovězí maso','Mleté maso','Šunka','Salám','Párky','Slanina']],
['fish','Ryby a mořské plody','🐟','#cffafe','#0e7490',['Losos','Treska','Tuňák','Sardinky','Krevety','Rybí filé','Uzená makrela']],
['pantry','Trvanlivé potraviny','🥫','#ffedd5','#c2410c',['Rýže','Těstoviny','Mouka','Cukr','Sůl','Olej','Ocet','Luštěniny','Konzervovaná rajčata','Kečup','Hořčice','Majonéza','Koření','Ovesné vločky','Káva','Čaj']],
['frozen','Mražené potraviny','❄️','#dbeafe','#1d4ed8',['Mražená zelenina','Mražené ovoce','Hranolky','Pizza','Rybí prsty','Zmrzlina','Led']],
['snacks','Sladkosti a pochutiny','🍫','#fce7f3','#be185d',['Čokoláda','Sušenky','Oplatky','Bonbony','Oříšky','Chipsy','Krekry','Popcorn','Müsli tyčinky']],
['drinks','Nápoje','🥤','#e0e7ff','#4338ca',['Minerální voda','Džus','Limonáda','Tonic','Sirup','Pivo','Víno','Káva','Čaj']],
['drugstore','Drogerie a hygiena','🧴','#ede9fe','#6d28d9',['Toaletní papír','Papírové kapesníky','Mýdlo','Sprchový gel','Šampon','Kondicionér','Zubní pasta','Zubní kartáček','Deodorant','Vatové tampony','Holicí potřeby']],
['household','Domácnost a úklid','🧽','#f1f5f9','#475569',['Prostředek na nádobí','Tablety do myčky','Prací gel','Aviváž','Čisticí prostředek','Houbičky','Hadříky','Pytle na odpadky','Papírové utěrky','Alobal','Pečicí papír','Potravinová fólie']],
['pets','Pro zvířata','🐾','#fef9c3','#a16207',['Granule','Konzervy','Pamlsky','Stelivo','Sáčky na exkrementy','Hračka','Šampon pro zvířata']],
['other','Ostatní','🛍️','#f3f4f6','#4b5563',['Baterie','Žárovky','Svíčky','Zápalky','Lepicí páska','Přání nebo dárek','Květiny']]
];
const fresh=()=>defs.map(([id,name,icon,color,accent,names])=>({id,name,icon,color,accent,items:names.map((name,i)=>({id:id+'-'+i,name,quantity:1,bought:false}))}));
let categories;try{categories=JSON.parse(localStorage.getItem(DATA_KEY))||fresh()}catch{categories=fresh()}
let open=new Set(), search='';
if(localStorage.getItem(THEME_KEY)==='dark')document.body.classList.add('dark');
const save=()=>localStorage.setItem(DATA_KEY,JSON.stringify(categories));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 const all=categories.flatMap(c=>c.items), bought=all.filter(i=>i.bought).length, q=search.trim().toLowerCase();
 const shown=categories.map(c=>({...c,shown:q?c.items.filter(i=>i.name.toLowerCase().includes(q)):c.items})).filter(c=>!q||c.name.toLowerCase().includes(q)||c.shown.length);
 document.getElementById('app').innerHTML=`<div class="wrap"><header class="hero"><div class="heroTop"><div><div class="eyebrow">Můj nákupní seznam</div><h1>Shopping List</h1><p>Přehledně podle kategorií a vždy po ruce.</p></div><div class="tools"><button class="theme" onclick="toggleTheme()"><span>${document.body.classList.contains('dark')?'☀️':'🌙'}</span> <span>${document.body.classList.contains('dark')?'Světlý':'Tmavý'}</span></button><button class="iconBtn cart">🛒</button></div></div><div class="stats"><div class="stat"><b>${all.length}</b><small>Celkem</small></div><div class="stat"><b class="amber">${all.length-bought}</b><small>Zbývá</small></div><div class="stat"><b class="green">${bought}</b><small>Koupeno</small></div></div></header>
 <div class="row searchRow"><input class="field" value="${esc(search)}" oninput="setSearch(this.value)" placeholder="Hledat položku nebo kategorii…"><button class="secondary" ${bought?'':'disabled'} onclick="clearBought()">Smazat koupené</button></div>
 <div class="row box"><input id="newCat" class="field" placeholder="Název nové kategorie…" onkeydown="if(event.key==='Enter')addCategory()"><button class="primary" onclick="addCategory()">+ Přidat</button></div>
 <div class="categories">${shown.map(catHTML).join('')}</div>${shown.length?'':'<div class="empty">Nic odpovídajícího nebylo nalezeno.</div>'}<div class="footer">Změny a zvolený vzhled se automaticky ukládají v tomto zařízení.</div></div>`;
}
function catHTML(c){const isOpen=open.has(c.id)||search.trim();return `<section class="category"><div class="catHead"><button class="catIcon" style="background:${c.color};color:${c.accent}" onclick="toggle('${c.id}')">${c.icon||'🛍️'}</button><button class="catTitle" onclick="toggle('${c.id}')"><b>${esc(c.name)}</b><small>${c.items.length} položek · ${c.items.filter(i=>i.bought).length} koupeno</small></button><button class="mini" onclick="renameCategory('${c.id}')">✎</button><button class="mini danger" onclick="deleteCategory('${c.id}')">×</button><button class="mini" onclick="toggle('${c.id}')">${isOpen?'▲':'▼'}</button></div>${isOpen?`<div class="items">${c.shown.map(i=>itemHTML(c,i)).join('')}${c.shown.length?'':'<div class="empty">V této kategorii zatím nic není.</div>'}<div class="addItem"><input id="add-${c.id}" class="field" placeholder="Přidat položku…" onkeydown="if(event.key==='Enter')addItem('${c.id}')"><button class="primary" onclick="addItem('${c.id}')">+</button></div></div>`:''}</section>`}
function itemHTML(c,i){return `<div class="item ${i.bought?'bought':''}"><button class="check" onclick="toggleBought('${c.id}','${i.id}')">✓</button><button class="name" onclick="renameItem('${c.id}','${i.id}')">${esc(i.name)}</button><div class="qty"><button onclick="qty('${c.id}','${i.id}',-1)">−</button><span>${i.quantity}</span><button onclick="qty('${c.id}','${i.id}',1)">+</button></div><button class="mini danger" onclick="deleteItem('${c.id}','${i.id}')">×</button></div>`}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem(THEME_KEY,document.body.classList.contains('dark')?'dark':'light');render()}
function setSearch(v){search=v;render()} function toggle(id){open.has(id)?open.delete(id):open.add(id);render()}
function addCategory(){const e=document.getElementById('newCat'),name=e.value.trim();if(!name)return;categories.push({id:'c'+Date.now(),name,icon:'🛍️',color:'#e0e7ff',accent:'#4338ca',items:[]});save();render()}
function renameCategory(id){const c=categories.find(x=>x.id===id),n=prompt('Nový název kategorie:',c.name);if(n&&n.trim()){c.name=n.trim();save();render()}}
function deleteCategory(id){if(confirm('Opravdu smazat celou kategorii?')){categories=categories.filter(c=>c.id!==id);save();render()}}
function addItem(cid){const e=document.getElementById('add-'+cid),name=e.value.trim();if(!name)return;categories.find(c=>c.id===cid).items.push({id:'i'+Date.now(),name,quantity:1,bought:false});save();render()}
function renameItem(cid,iid){const i=categories.find(c=>c.id===cid).items.find(i=>i.id===iid),n=prompt('Nový název položky:',i.name);if(n&&n.trim()){i.name=n.trim();save();render()}}
function deleteItem(cid,iid){const c=categories.find(c=>c.id===cid);c.items=c.items.filter(i=>i.id!==iid);save();render()}
function toggleBought(cid,iid){const i=categories.find(c=>c.id===cid).items.find(i=>i.id===iid);i.bought=!i.bought;save();render()}
function qty(cid,iid,d){const i=categories.find(c=>c.id===cid).items.find(i=>i.id===iid);i.quantity=Math.max(1,i.quantity+d);save();render()}
function clearBought(){if(confirm('Smazat všechny koupené položky?')){categories.forEach(c=>c.items=c.items.filter(i=>!i.bought));save();render()}}
render();
</script>
</body></html>
